<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Lotus | Hieroglyphic SVG Editor</title>
    <meta name="description" content="A professional, web-based Hieroglyphic SVG Editor for archaeology students. Inspired by JSesh, built for the modern web." />
    
    <!-- Performance optimizations -->
    <link rel="preconnect" href="/" />
    <link rel="dns-prefetch" href="/" />
    
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="./src/main.tsx" />
    <link rel="modulepreload" href="./src/App.tsx" />
    
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lotus-editor.vercel.app/" />
    <meta property="og:title" content="Lotus | Hieroglyphic SVG Editor" />
    <meta property="og:description" content="Design and manipulate hieroglyphic compositions with ease. High-quality SVG export and clipboard support." />
    <meta property="og:image" content="./icon-512.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://lotus-editor.vercel.app/" />
    <meta property="twitter:title" content="Lotus | Hieroglyphic SVG Editor" />
    <meta property="twitter:description" content="The production-ready Hieroglyphic editor for the modern web." />
    <meta property="twitter:image" content="./icon-512.png" />

    <!-- Optimize font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <!-- Critical CSS inlined for faster rendering -->
    <style>
      /* Critical loading styles */
      body { 
        margin: 0; 
        font-family: system-ui, -apple-system, sans-serif; 
        background: #fdfaf5;
        overflow: hidden; /* Prevent scroll during loading */
      }
      .loading-screen { 
        position: fixed; 
        inset: 0; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        background: #fdfaf5; 
        z-index: 9999;
      }
      .loading-content { 
        text-align: center; 
        color: #92400e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 200px;
      }
      .loading-glyph { 
        font-size: 4rem; 
        animation: pulse 2s infinite; 
        margin-bottom: 1.5rem;
        line-height: 1;
      }
      .loading-text {
        font-size: 1.1rem;
        font-weight: 500;
        margin-bottom: 1.5rem;
        color: #92400e;
      }
      .loading-bar {
        width: 12rem;
        height: 0.375rem;
        background: #fbbf24;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .loading-progress {
        height: 100%;
        background: linear-gradient(90deg, #d97706, #f59e0b);
        border-radius: 9999px;
        animation: progress 2s infinite;
        position: absolute;
        top: 0;
        left: 0;
      }
      @keyframes pulse { 
        0%, 100% { opacity: 0.6; transform: scale(1); } 
        50% { opacity: 1; transform: scale(1.05); } 
      }
      @keyframes progress {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }
      /* Responsive adjustments */
      @media (max-width: 640px) {
        .loading-glyph { font-size: 3rem; }
        .loading-text { font-size: 1rem; }
        .loading-bar { width: 10rem; }
      }
      /* Custom scrollbar for mobile */
      .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback loading screen for users with JS disabled or slow connections -->
      <div class="loading-screen">
        <div class="loading-content">
          <div class="loading-glyph">𓆸</div>
          <div class="loading-text">Loading Lotus Editor...</div>
          <div class="loading-bar">
            <div class="loading-progress"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
